[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alkham"
version = "0.1.0"
description = "Frictionless, one-command capture of AI coding-CLI sessions (Claude Code + Aider) as readable Markdown notes. Library-first."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ali" }]
keywords = ["claude-code", "aider", "obsidian", "markdown", "knowledge-base", "transcripts", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.9",
  "rich>=13.0",
  "pyyaml>=6.0",
  "platformdirs>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "pre-commit>=3.0",
  "build>=1.0",
  "twine>=5.0",
  "types-PyYAML>=6.0",
]
watch = ["watchdog>=3.0"]

[project.scripts]
alkham = "alkham.cli:app"

[project.urls]
# GitHub owner pinned for PyPI Trusted Publishing (Phase 6 binds OIDC to this slug).
Homepage = "https://github.com/AliAA1444/alkham"
Repository = "https://github.com/AliAA1444/alkham"
Issues = "https://github.com/AliAA1444/alkham/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alkham"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
# Vendored BMad tooling and skill scripts are not part of this package.
extend-exclude = ["_bmad", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
